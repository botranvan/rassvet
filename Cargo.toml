[workspace]
resolver = "3"
members = [
    "crates/os-client",
    "crates/ext-api",
    "crates/server",
    "extensions/octavia",
    "extensions/magnum",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
rassvet-os-client = { path = "crates/os-client" }
rassvet-ext-api = { path = "crates/ext-api" }
rassvet-ext-octavia = { path = "extensions/octavia" }
rassvet-ext-magnum = { path = "extensions/magnum" }

anyhow = "1"
base64 = "0.22"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
mime_guess = "2"
rand = "0.9"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "rsa", "getrandom"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
