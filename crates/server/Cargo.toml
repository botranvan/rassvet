[package]
name = "rassvet"
description = "Next-gen OpenStack dashboard — single binary server with embedded UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rassvet"
path = "src/main.rs"

[features]
default = ["ext-octavia", "ext-magnum"]
# One feature per extension crate under extensions/.
ext-octavia = ["dep:rassvet-ext-octavia"]
ext-magnum = ["dep:rassvet-ext-magnum"]

[dependencies]
anyhow.workspace = true
chacha20poly1305.workspace = true
sha2.workspace = true
base64.workspace = true
axum.workspace = true
axum-extra.workspace = true
chrono.workspace = true
clap.workspace = true
mime_guess.workspace = true
rassvet-ext-api.workspace = true
rassvet-ext-octavia = { workspace = true, optional = true }
rassvet-ext-magnum = { workspace = true, optional = true }
rassvet-os-client.workspace = true
rand.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
ssh-key.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
